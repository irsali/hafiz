[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hafiz"
version = "0.1.0"
description = "A sovereign, CLI-first intelligence layer for your workspace"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Irshad" },
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "fastembed>=0.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "tomli-w>=1.0",
    "aiofiles>=24.1",
    "anthropic>=0.40",
    "watchdog>=6.0",
    "pathspec>=0.12",
    "networkx>=3.3",
    "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/irsali/hafiz"
Repository = "https://github.com/irsali/hafiz"
Issues = "https://github.com/irsali/hafiz/issues"

[project.scripts]
hafiz = "hafiz.cli:main"

[project.optional-dependencies]
# NOTE on all accelerator extras: onnxruntime, onnxruntime-gpu and
# onnxruntime-openvino all install the SAME `onnxruntime` import package, so
# only one can be active in a venv — whichever is installed last overwrites the
# others' files while leaving their metadata behind. Installing an accelerator
# extra is therefore not proof the accelerator is in use. `hafiz doctor` detects
# that shadowing and prints the real remedy (uninstall the CPU wheel), because
# reinstalling the extra appears to succeed and changes nothing. Never combine
# two of these extras.
cuda = [
    # CUDA-only wheels; no macOS build. The markers let `pip install hafiz[cuda]`
    # succeed on a Mac (the extra resolves to nothing) instead of erroring — Apple
    # Silicon runs CPU embeddings, which the `auto` device path falls back to.
    "fastembed-gpu>=0.8 ; sys_platform != 'darwin'",
    "onnxruntime-gpu>=1.20 ; sys_platform != 'darwin'",
]
gpu = [
    # Historical alias for `cuda`, kept so existing install instructions and
    # scripts keep working. Same contents deliberately: an extra that only
    # depends on `hafiz[cuda]` would resolve fine but reads worse in `pip`
    # output and in lockfiles.
    "fastembed-gpu>=0.8 ; sys_platform != 'darwin'",
    "onnxruntime-gpu>=1.20 ; sys_platform != 'darwin'",
]
openvino = [
    # Intel iGPU / NPU via OpenVINO. Linux + Windows only. Speedup for this
    # embedding model is UNMEASURED — offered because the hardware is otherwise
    # idle, not because it is known to help. Benchmark before adopting.
    "onnxruntime-openvino>=1.20 ; sys_platform != 'darwin'",
]
js = [
    # JavaScript / TypeScript AST parser. Optional so the base install stays
    # lean — the tree_sitter_js parser self-registers only when these import.
    # Prebuilt wheels (no compiler needed) on CPython for Linux/macOS/Windows.
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Upper-bounded so the now-blocking CI lint gate is reproducible: a new
    # ruff minor can add rules that would fail the gate out of band. Bump
    # deliberately, re-running `ruff check . && ruff format .` against it.
    "ruff>=0.15,<0.16",
    # JS/TS parser deps so the test suite + CI exercise tree_sitter_js
    # instead of skipping it. Mirrors the `js` extra.
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.pep8-naming]
# `G` is the idiomatic NetworkX graph variable across the ecosystem and its
# docs; lowercasing it everywhere would hurt readability, not help it.
extend-ignore-names = ["G"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
