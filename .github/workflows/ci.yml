name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Non-blocking for now: the repo carries pre-existing ruff debt (lint +
    # format) that predates CI. This job surfaces it on every PR without
    # gating merges. Flip `continue-on-error` to false once the backlog is
    # cleared in a dedicated cleanup pass — tracked in cli-surface-audit.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test-linux:
    name: Test (Linux, full suite + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector ships an image with the extension preinstalled, so the
        # `CREATE EXTENSION vector` in conftest just works.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hafiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HAFIZ_DATABASE__URL: postgresql+asyncpg://postgres:postgres@localhost:5432/hafiz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU; no GPU extras)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  test-macos:
    name: Test (macOS, DB-free portability subset)
    runs-on: macos-14  # Apple Silicon (arm64)
    env:
      # Postgres isn't provisioned here; the macOS leg exists to guard the
      # platform-sensitive code paths (host_probe sysctl/vm_stat, daemon
      # $TMPDIR socket dir, config path resolution). conftest prunes the
      # DB-dependent modules in this mode.
      HAFIZ_TEST_NO_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU; [gpu] extras resolve to nothing on darwin)
        run: pip install -e ".[dev]"
      - name: Run DB-free subset
        run: pytest -q
